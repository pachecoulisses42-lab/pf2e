name: Android D20 Companion

# Compiles and tests android-d20/. The rules engine is plain Kotlin/JVM; the app needs the Android SDK.
on:
  push:
    branches: ['claude/**', v13-dev, v14-dev]
    paths: ['android-d20/**', '.github/workflows/android-d20.yml']
  pull_request:
    paths: ['android-d20/**', '.github/workflows/android-d20.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-d20-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android-d20

jobs:
  engine:
    name: Rules engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test :engine (no Android SDK needed)
        run: ./gradlew -PengineOnly=true :engine:test --console=plain
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-report
          path: android-d20/engine/build/reports/tests/test

  app:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The action's default asks for the removed 'tools' package and fails, so list exactly what AGP 8.7 needs.
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: d20-companion-debug-apk
          path: android-d20/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-build-reports
          path: android-d20/app/build/reports
