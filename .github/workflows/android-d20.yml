name: Android D20 Companion

# Compiles and tests android-d20/. The rules engine is plain Kotlin/JVM; the app needs the Android SDK.
on:
  push:
    branches: ['claude/**', v13-dev, v14-dev]
    paths: ['android-d20/**', '.github/workflows/android-d20.yml']
  pull_request:
    paths: ['android-d20/**', '.github/workflows/android-d20.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-d20-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android-d20

jobs:
  engine:
    name: Rules engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test :engine (no Android SDK needed)
        run: ./gradlew -PengineOnly=true :engine:test --console=plain
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-report
          path: android-d20/engine/build/reports/tests/test

  app:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The action's default asks for the removed 'tools' package and fails, so list exactly what AGP 8.7 needs.
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: d20-companion-debug-apk
          path: android-d20/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-build-reports
          path: android-d20/app/build/reports

  # Keeps one fixed download link for the newest APK:
  # https://github.com/<owner>/<repo>/releases/download/android-latest/d20-companion.apk
  publish:
    name: Publish APK download link
    runs-on: ubuntu-latest
    needs: app
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: d20-companion-debug-apk
          path: apk
      - name: Update the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/*.apk d20-companion.apk
          notes="APK de teste (debug) do D20 Companion, gerado de ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7} em $(date -u +'%Y-%m-%d %H:%M UTC')."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --notes "$notes"
          else
            gh release create android-latest --prerelease --title "D20 Companion (último APK)" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload android-latest d20-companion.apk --clobber
